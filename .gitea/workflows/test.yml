name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Lint (syntax errors + pyflakes)
        run: ruff check .

      - name: Run tests
        # PYTHONPATH supplies .gitea/ci_stubs/lancedb.py: requirements.txt
        # installs lancedb only on arm64 (and its native extension SIGILLs on
        # this runner's CPU anyway). The plugin runs without it; the stub only
        # lets test_search_ranking import lancedb and skip its real-store tests.
        run: PYTHONPATH=.gitea/ci_stubs pytest tests/ -q
